version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # SvelteKit 3 and svelte-check support TypeScript 6; TypeScript 7 (the native port) isn't supported yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep Node's type definitions matched to the oldest supported Node.js version (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      svelte:
        patterns:
          [
            'svelte',
            'svelte-check',
            '@sveltejs/*',
            'vite',
            'prettier-plugin-svelte',
            'eslint-plugin-svelte'
          ]
      lint:
        patterns:
          [
            'eslint',
            '@eslint/*',
            'eslint-config-prettier',
            'typescript-eslint',
            'prettier',
            'globals'
          ]
      test:
        patterns: ['vitest', '@playwright/test']
      types:
        patterns: ['@types/*', 'typescript']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'build(docker)'
